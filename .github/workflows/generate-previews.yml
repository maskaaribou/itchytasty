name: Generate GIF previews

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Download GIFs and generate previews
        env:
          CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8CIQQhD3_8ZUHFTjfBpVRHg80thTHSu-gZFH37f-PNOGEeYjM7Bu_2ZinK59tVDYxrJM5lpkue8Iy/pub?gid=1913411064&single=true&output=csv"
        run: |
          mkdir -p gifs/previews
          mkdir -p gifs/temp_gifs

          curl -L "$CSV_URL" -o sheet.csv

          python3 - <<'PY'
          import csv
          import re

          with open("sheet.csv", "r", encoding="utf-8-sig", newline="") as file:
              reader = csv.DictReader(file)

              with open("gif_urls.txt", "w", encoding="utf-8") as output:
                  for row in reader:
                      url = row.get("GIF", "").strip()

                      if not url:
                          continue

                      match = re.match(r"\[.*?\]\((https?://[^)]+)\)", url)

                      if match:
                          url = match.group(1)

                      output.write(url + "\n")
          PY

          while IFS= read -r url; do
            if [ -z "$url" ]; then
              continue
            fi

            filename=$(echo -n "$url" | md5sum | cut -d ' ' -f 1)
            output="gifs/previews/${filename}.jpg"

            if [ -f "$output" ]; then
              echo "Preview already exists: $output"
              continue
            fi

            echo "Downloading: $url"

            curl -L --max-time 30 "$url" \
              -o "gifs/temp_gifs/${filename}.gif"

            if [ $? -ne 0 ]; then
              echo "Download failed: $url"
              continue
            fi

            convert \
              "gifs/temp_gifs/${filename}.gif[0]" \
              -resize "500x>" \
              -background white \
              -alpha remove \
              -quality 85 \
              "$output"

            rm -f "gifs/temp_gifs/${filename}.gif"
          done < gif_urls.txt

      - name: Commit previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gifs/previews/

          if git diff --cached --quiet; then
            echo "No new previews."
          else
            git commit -m "Generate GIF previews"
            git push
          fi
